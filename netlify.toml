[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Decap CMS needs Netlify Identity + Git Gateway enabled in the Netlify
# dashboard (one-time setup — see DEPLOY.md). The widget is loaded by
# admin/index.html; nothing extra needed here.

# Pretty defaults: long-cache hashed assets, no-cache HTML so updates ship.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Friendly redirects for the old static-sitemap location.
[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301
